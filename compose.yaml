name: customer-support-classifier
services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      SUPPORT_MODEL: distilbert
      SUPPORT_DB_PATH: /workspace/data/runtime/support.sqlite3
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ./models
        target: /workspace/models
        read_only: true
        bind:
          create_host_path: false
      - support-data:/workspace/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: unless-stopped
  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      SUPPORT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  support-data:
